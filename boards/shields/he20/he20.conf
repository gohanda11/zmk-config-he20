CONFIG_ZMK_KEYBOARD_NAME="HE20"

CONFIG_ZMK_BLE=y

CONFIG_ADC=y
CONFIG_HE_KSCAN_MULTIPLEXER=y
CONFIG_HE_INPUT_LISTENER=y
CONFIG_HE_INPUT_PROCESSOR_ADJUSTABLE_ACTUATION=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_HE_LOG_LEVEL=3

# Settings support
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Trackball (PMW3610 - badjeff/zmk-pmw3610-driver) - disabled for debugging
# CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_MOUSE=y
# CONFIG_SPI=y
# CONFIG_INPUT=y
# CONFIG_PMW3610_ALT=y
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=16
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300
# CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
# CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
# CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=50
# CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=100
# CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=10000
# CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000

# XY Clipper - clips diagonal scroll input to dominant axis only - disabled for debugging
# CONFIG_XY_CLIPPER=y

# Stack sizes for hall effect processing
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
